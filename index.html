<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spectrum: Fight for Success</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#0b0b14;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#joy{position:fixed;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff5;touch-action:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fffc;pointer-events:none}
#btns{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,66px);gap:8px}
#btns button{height:50px;border:2px solid #222;border-radius:14px;background:#fff;font:700 13px system-ui;color:#222;touch-action:none;opacity:.88}
#btns button:active{background:#ddd}
#btns .u{grid-column:span 3;background:#ccc;color:#777}
#btns .b{grid-column:span 3;background:#cfe6ff}
#btns .u.rdy{background:#f39c12;color:#fff;box-shadow:0 0 14px #f39c12}
.sel #joy,.sel #btns,.end #joy,.end #btns{display:none}
#rot{display:none;position:fixed;inset:0;background:#000;color:#fff;z-index:9;align-items:center;justify-content:center;font:700 22px system-ui;text-align:center}
@media (orientation:portrait){#rot{display:flex}}
#nb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;gap:6px;z-index:5;touch-action:auto}
#nb button,#nb input{font:600 13px system-ui;padding:7px 10px;border-radius:10px;border:2px solid #222;background:#fff;color:#222}
#nb input{width:92px;user-select:text;-webkit-user-select:text}
body:not(.sel) #nb{display:none}
</style></head><body class="sel">
