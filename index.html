<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#btns [data-k=p]{left:32px;top:119px;background:#e5484d}
#btns [data-k=k]{left:84px;top:171px;background:#2fb859}
#btns [data-k=g]{left:136px;top:119px;background:#3a7bd5}
#btns [data-k=b]{left:84px;top:67px;background:#f5b82e;color:#3a2a00;text-shadow:none}
#btns .u{left:142px;top:0;width:76px;height:76px;font-size:11px;background:#5b5170;color:#d9d2ea;border-color:rgba(255,255,255,.35)}
#btns .u.rdy{background:radial-gradient(circle at 40% 35%,#ffd27a,#ff7a1a);color:#fff;box-shadow:0 0 18px #ff9f1a,inset 0 -5px 0 rgba(0,0,0,.25)}
.sel #joy,.sel #btns,.end #joy,.end #btns{display:none}
#rot{display:none;position:fixed;inset:0;background:#000;color:#fff;z-index:9;align-items:center;justify-content:center;font:700 22px system-ui;text-align:center}
@media (orientation:portrait){#rot{display:flex}}
#nb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;gap:6px;z-index:5;touch-action:auto}
#nb button,#nb input{font:600 13px system-ui;padding:7px 10px;border-radius:10px;border:2px solid #222;background:#fff;color:#222}
#nb input{width:92px;user-select:text;-webkit-user-select:text}
body:not(.sel) #nb{display:none}
#pz{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:6;width:46px;height:36px;font:700 16px system-ui;border-radius:12px;border:2px solid #fff;background:#000a;color:#fff;touch-action:manipulation}
